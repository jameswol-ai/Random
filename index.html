<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RANDOM Studio</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Login Screen (hidden when logged in) -->
  <div id="login-screen" class="login-screen">
    <div class="login-card glass-card">
      <div class="logo-text">⚡ RANDOM</div>
      <p>Single‑Project AEC Studio</p>
      <form id="login-form">
        <input type="text" id="username" placeholder="Username" required>
        <input type="password" id="password" placeholder="Password" required>
        <div class="login-buttons">
          <button type="submit">Login</button>
          <button type="button" id="register-btn">Register</button>
        </div>
        <div id="login-error" class="error"></div>
      </form>
    </div>
  </div>

  <!-- Main App (hidden when not logged in) -->
  <div id="app" class="app-container" style="display:none;">
    <aside class="sidebar">
      <div class="logo-text" style="font-size:1.6rem;">⚡ RANDOM</div>
      <div class="user-info">
        <span id="sidebar-username"></span>
        <div class="xp-bar-container">
          <div class="xp-bar">
            <div class="xp-fill" id="xp-fill"></div>
          </div>
          <span id="xp-text"></span>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-page="dashboard">Dashboard</button>
        <button class="nav-btn" data-page="ram">Ram Assistant</button>
        <button class="nav-btn" data-page="materials">Materials & Cost</button>
        <button class="nav-btn" data-page="boq">BOQ & Export</button>
        <button class="nav-btn" data-page="settings">Settings</button>
      </nav>
      <button id="logout-btn" class="logout-btn">🚪 Logout</button>
    </aside>
    <main id="main-content" class="main-content">
      <!-- Page content dynamically inserted here -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
