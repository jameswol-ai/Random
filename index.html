<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamlit Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Streamlit-like layout: main content -->
  <div class="main">
    <div class="block-container">
      <h1>Your App</h1>
      <p>This looks like a fresh Streamlit app.</p>
      <button class="stButton">Click me</button>
      <div class="stTextInput">
        <label>Enter text</label>
        <input type="text" placeholder="Type here...">
      </div>
    </div>
  </div>
</body>
</html>
